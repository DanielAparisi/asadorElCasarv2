# Runs the same three commands the project is checked with locally, on every PR
# and on pushes to main. Nothing else: there are no tests yet, and `npm run
# build` already runs `tsc -b`, so type errors fail here too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly the lockfile, so a
      # green CI means the same dependency tree everyone else has.
      - run: npm ci

      - run: npm run lint

      # Formatting, before the slow steps: it is the cheapest failure and the
      # one with the most obvious fix (`npm run format`). Prettier is pinned to
      # an exact version, so the CI cannot start failing on its own the day a
      # release changes where it puts a line break.
      - run: npm run format:check

      # The build reads VITE_SUPABASE_* from the environment, and these are
      # placeholders: nothing here talks to Supabase, and the two real values
      # are public anon ones anyway. They cannot simply be left out any more.
      #
      # Vite inlines `import.meta.env.VITE_*` at build time, so a build with no
      # variables does not produce an app that will read them later — it
      # produces one with `undefined` baked in, whose menu answers 401 forever.
      # Since 05/09/2026 both entry points refuse to build in that state
      # (features/menu/hooks/useMenu.ts, shared/lib/supabaseEnv.ts), which is
      # why this step now has to hand them something.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
