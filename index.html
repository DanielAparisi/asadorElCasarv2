<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Do not leak the panel route to third parties when leaving via a link. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The panel must not show up in search engines. The public menu should,
         but that is controlled per route from the hosting, not here. -->
    <!-- The two faces the first paint needs, preloaded so they are already
         there when the CSS asks for them: the headline in Anton and the body
         in Space Grotesk. The rest (Space Mono, the -ext subsets) are fetched
         only if the page turns out to need them. `crossorigin` is not
         optional on a font preload — without it the browser downloads the
         file twice. The @font-face rules live in src/index.css. -->
    <link rel="preload" href="/fonts/anton-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The title, the description, the link preview and the business card are
         written here at build time from src/features/landing/seo.ts, which
         reads the address and the opening hours from content.ts. A crawler
         never runs the JavaScript, so they cannot come from React. -->
    <title>Asador El Casar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
